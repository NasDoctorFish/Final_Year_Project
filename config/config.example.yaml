# Copy to config/config.yaml and edit. config.yaml is gitignored.
#
# No `ai:` section: AI explanation runs entirely on the backend now (see
# backend/.env.example's GEMINI_API_KEY / GEMINI_MODEL), not on whichever machine
# happens to run the CLI or GUI. There is nothing to configure client-side for it.

device:
  serial: null            # specific adb serial, or null to auto-select the only device
  adb_path: adb           # path to the adb binary

runtime:
  # Number of trials per scenario for the statistical baseline.
  trials_per_scenario: 30
  # Wait (seconds) for a screen to settle before observing.
  settle_seconds: 2

api:
  # Backend for accounts and history. BioAudit keeps no local copy of a scan, so signing
  # in is required before scan-apk, assess, or the GUI's scan tabs will do anything;
  # `enabled` just tracks whether this run has signed in yet. Defaults to the hosted
  # Cloud Run deployment; point at http://127.0.0.1:4000/api instead to use a backend
  # you're running yourself (see backend/README.md).
  enabled: false
  base_url: https://bioaudit-api-391854054876.us-central1.run.app/api

report:
  output_dir: reports
